<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日程回答フォーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background-color: #f5f5f5;
      color: #333;
      min-height: 100vh;
    }
    .header {
      background-color: #06C755;
      color: #fff;
      padding: 16px;
      text-align: center;
    }
    .header h1 { font-size: 18px; font-weight: bold; }
    .content { padding: 16px; max-width: 480px; margin: 0 auto; }
    .loading { text-align: center; padding: 40px 16px; color: #666; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #06C755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      background-color: #fff3f3;
      border: 1px solid #ffcccc;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
      color: #c0392b;
      text-align: center;
      line-height: 1.6;
    }
    .empty { text-align: center; padding: 40px 16px; color: #666; line-height: 1.6; }
    .schedule-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .schedule-card {
      background-color: #fff;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .schedule-date { font-size: 15px; font-weight: bold; margin-bottom: 4px; color: #222; }
    .schedule-facility { font-size: 13px; color: #666; margin-bottom: 12px; }
    .answer-buttons { display: flex; gap: 8px; }
    .btn-answer {
      flex: 1; padding: 10px 8px;
      border: 2px solid #ddd;
      border-radius: 6px;
      background-color: #f9f9f9;
      color: #555;
      font-size: 14px; font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .btn-answer:active { opacity: 0.7; }
    .btn-answer.selected-can { background-color: #06C755; border-color: #06C755; color: #fff; }
    .btn-answer.selected-undecided { background-color: #757575; border-color: #757575; color: #fff; }
    .submit-area {
      position: sticky; bottom: 0;
      background-color: #f5f5f5;
      padding: 12px 0 24px;
    }
    .btn-submit {
      display: block; width: 100%; padding: 16px;
      background-color: #06C755;
      color: #fff; border: none;
      border-radius: 8px;
      font-size: 16px; font-weight: bold;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .btn-submit:disabled { background-color: #aaa; cursor: not-allowed; }
    .btn-submit:not(:disabled):active { opacity: 0.8; }
    .success { text-align: center; padding: 40px 16px; color: #06C755; }
    .success-icon { font-size: 48px; margin-bottom: 16px; }
    .success-text { font-size: 16px; font-weight: bold; color: #333; line-height: 1.6; }
    .guide-text { font-size: 13px; color: #666; margin-bottom: 16px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="header"><h1>バドミントン 日程回答</h1></div>
  <div class="content" id="app">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>読み込み中...</p>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ★ 設定値 — 自分の値に書き換えてください
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    var LIFF_ID     = '2010067159-goZKGxNN';
    var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbz0gRzFCoweztAOeYg5u5Y7TNOfFGhBXApUV59neZgtiVF_UZxUO7uC1BWdy3rUGrMjSw/exec';

    var answers = {};

    // ─── 初期化 ───
    window.onload = function () {
      if (!LIFF_ID || LIFF_ID === 'REPLACE_WITH_LIFF_FORM_ID') {
        showError('LIFF_ID が設定されていません。docs/liff.html を編集してください。');
        return;
      }

      var timeoutId = setTimeout(function () {
        showError('初期化がタイムアウトしました。ページを閉じて再度お試しください。');
      }, 15000);

      liff.init({ liffId: LIFF_ID })
        .then(function () {
          clearTimeout(timeoutId);
          if (!liff.isLoggedIn()) { liff.login(); return; }
          loadSchedules();
        })
        .catch(function (err) {
          clearTimeout(timeoutId);
          showError('初期化エラー: ' + (err && err.message ? err.message : String(err)));
        });
    };

    // ─── スケジュール取得 ───
    function loadSchedules() {
      var idToken = liff.getIDToken();
      if (!idToken) { showError('ログイン情報の取得に失敗しました。'); return; }

      fetch(GAS_API_URL + '?liff=getSchedules&idToken=' + encodeURIComponent(idToken))
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok) { showError('データの取得に失敗しました。(' + (res.error || '') + ')'); return; }
          renderForm(res.data.schedules, res.data.userAnswers);
        })
        .catch(function () { showError('通信エラーが発生しました。ページを閉じて再度お試しください。'); });
    }

    // ─── フォーム描画 ───
    function renderForm(schedules, userAnswers) {
      answers = {};
      if (userAnswers) {
        for (var key in userAnswers) { answers[key] = userAnswers[key]; }
      }

      var app = document.getElementById('app');
      if (!schedules || schedules.length === 0) {
        app.innerHTML = '<div class="empty"><p>現在、回答できる日程がありません。<br>またの機会にご利用ください。</p></div>';
        return;
      }

      var html = '<p class="guide-text">参加できる日程に「行ける」、未定の場合は「未定」を選んでください。<br>選ばなかった日程は「行けない」として扱います。</p>';
      html += '<div class="schedule-list" id="scheduleList">';

      for (var i = 0; i < schedules.length; i++) {
        var s = schedules[i];
        var dateLabel = formatDateLabel(s.date, s.startTime, s.endTime);
        var cur = answers[s.scheduleId] || '';
        html += '<div class="schedule-card" data-id="' + esc(s.scheduleId) + '">';
        html += '<div class="schedule-date">' + esc(dateLabel) + '</div>';
        html += '<div class="schedule-facility">' + esc(s.facilityName) + '</div>';
        html += '<div class="answer-buttons">';
        html += '<button class="btn-answer' + (cur === 'can' ? ' selected-can' : '') + '" onclick="select(\'' + esc(s.scheduleId) + '\',\'can\')">行ける</button>';
        html += '<button class="btn-answer' + (cur === 'undecided' ? ' selected-undecided' : '') + '" onclick="select(\'' + esc(s.scheduleId) + '\',\'undecided\')">未定</button>';
        html += '</div></div>';
      }

      html += '</div><div class="submit-area"><button class="btn-submit" id="submitBtn" onclick="submit()">送信する</button></div>';
      app.innerHTML = html;
    }

    // ─── 回答選択 ───
    function select(scheduleId, value) {
      if (answers[scheduleId] === value) { delete answers[scheduleId]; }
      else { answers[scheduleId] = value; }

      var card = document.querySelector('.schedule-card[data-id="' + scheduleId + '"]');
      if (!card) return;
      var btns = card.querySelectorAll('.btn-answer');
      var cur = answers[scheduleId] || '';
      btns[0].className = 'btn-answer' + (cur === 'can' ? ' selected-can' : '');
      btns[1].className = 'btn-answer' + (cur === 'undecided' ? ' selected-undecided' : '');
    }

    // ─── 送信 ───
    function submit() {
      var idToken = liff.getIDToken();
      if (!idToken) { showError('ログイン情報の取得に失敗しました。'); return; }

      var btn = document.getElementById('submitBtn');
      if (btn) { btn.disabled = true; btn.textContent = '送信中...'; }

      var url = GAS_API_URL + '?liff=submit'
        + '&idToken=' + encodeURIComponent(idToken)
        + '&answers=' + encodeURIComponent(JSON.stringify(answers));

      fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok) {
            if (btn) { btn.disabled = false; btn.textContent = '送信する'; }
            showError('送信に失敗しました。(' + (res.error || '') + ')');
            return;
          }
          var app = document.getElementById('app');
          app.innerHTML = '<div class="success"><div class="success-icon">&#10003;</div><p class="success-text">回答を送信しました！<br>ご回答ありがとうございます。</p></div>';
          setTimeout(function () { liff.closeWindow(); }, 1500);
        })
        .catch(function () {
          if (btn) { btn.disabled = false; btn.textContent = '送信する'; }
          showError('通信エラーが発生しました。ページを閉じて再度お試しください。');
        });
    }

    // ─── ユーティリティ ───
    function showError(msg) {
      document.getElementById('app').innerHTML = '<div class="error">' + esc(msg) + '</div>';
    }

    function formatDateLabel(date, startTime, endTime) {
      var w = ['日','月','火','水','木','金','土'];
      var d = new Date(date + 'T00:00:00+09:00');
      return (d.getMonth()+1) + '/' + d.getDate() + '(' + w[d.getDay()] + ') ' + startTime + '〜' + endTime;
    }

    function esc(s) {
      if (typeof s !== 'string') return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
  </script>
</body>
</html>
