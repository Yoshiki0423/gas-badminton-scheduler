<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日程回答フォーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background-color: #f5f5f5;
      color: #333;
      min-height: 100vh;
    }

    /* ヘッダー */
    .header {
      background-color: #06C755;
      color: #fff;
      padding: 16px;
      text-align: center;
    }
    .header h1 { font-size: 18px; font-weight: bold; }

    /* コンテンツエリア */
    .content { padding: 16px; max-width: 520px; margin: 0 auto; padding-bottom: max(100px, calc(env(safe-area-inset-bottom) + 80px)); }

    /* 読み込み中 */
    .loading { text-align: center; padding: 40px 16px; color: #666; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #06C755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* エラー */
    .error {
      background-color: #fff3f3;
      border: 1px solid #ffcccc;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
      color: #c0392b;
      text-align: center;
      line-height: 1.6;
    }

    /* 空のとき */
    .empty { text-align: center; padding: 40px 16px; color: #666; line-height: 1.6; }

    /* 説明テキスト */
    .guide-text { font-size: 13px; color: #666; margin-bottom: 16px; line-height: 1.6; }

    /* 日付ブロック一覧 */
    .date-list { display: flex; flex-direction: column; gap: 12px; }

    /* 日付ブロック */
    .date-block {
      background-color: #fff;
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    /* 日付見出し */
    .date-label {
      font-size: 15px;
      font-weight: bold;
      color: #222;
      margin-bottom: 4px;
    }

    /* 施設情報行 */
    .facility-info {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      line-height: 1.6;
      white-space: pre-line;
    }

    /* スロットボタン群(6列横並び) */
    .slot-row {
      display: flex;
      gap: 5px;
      flex-wrap: nowrap;
    }

    /* スロットボタン */
    .btn-slot {
      flex: 1;
      min-width: 0;
      min-height: 44px; /* WCAG 2.5.5 AAA タップターゲット */
      padding: 10px 2px;
      border: 2px solid #ddd;
      border-radius: 6px;
      background-color: #fff;
      color: #333;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
      transition: all 0.1s ease;
      word-break: keep-all;
    }
    .btn-slot:active { opacity: 0.7; }

    /* グレーアウト(施設が開いていないスロット) */
    .btn-slot.grayed {
      background-color: #e0e0e0;
      border-color: #e0e0e0;
      color: #aaa;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* ○ 選択済み */
    .btn-slot.selected-can {
      background-color: #06C755;
      border-color: #06C755;
      color: #fff;
    }

    /* △ 選択済み */
    .btn-slot.selected-undecided {
      background-color: #757575;
      border-color: #757575;
      color: #fff;
    }

    /* 送信ボタン(画面下部に固定) */
    .submit-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(245,245,245,0.96);
      padding: 12px 16px 24px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    }
    .btn-submit {
      display: block;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
      background-color: #06C755;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .btn-submit:disabled { background-color: #aaa; cursor: not-allowed; }
    .btn-submit:not(:disabled):active { opacity: 0.8; }

    /* 送信完了 */
    .success { text-align: center; padding: 40px 16px; }
    .success-icon { font-size: 48px; color: #06C755; margin-bottom: 16px; }
    .success-text { font-size: 16px; font-weight: bold; color: #333; line-height: 1.6; }

    /* 送信中プログレスバー */
    .submit-area { position: relative; }
    .submit-progress {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      overflow: hidden;
      display: none;
    }
    .submit-progress.active { display: block; }
    .submit-progress::after {
      content: '';
      display: block;
      height: 100%;
      background-color: #06C755;
      animation: progress-slide 1.2s ease-in-out infinite;
    }
    @keyframes progress-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    /* アニメーション無効化（前庭機能障害ユーザー向け） */
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: #06C755; }
      .btn-slot { transition: none; }
      .btn-submit { transition: none; }
      .submit-progress::after { animation: none; background-color: #06C755; width: 100%; transform: none; }
    }
  </style>
</head>
<body>
  <div class="header"><h1>バドミントン 日程回答</h1></div>

  <div class="content" id="app">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>読み込み中...</p>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 設定値(F-4)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    var LIFF_ID     = '2010067159-goZKGxNN';
    var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbywUhAuYHGZlQT04wik381Cofo6vxLCShPFsyKf7GXAd7ypuCdiwMws2T5mOEkJtPVPrA/exec';

    // ─── 現在の回答を保持するオブジェクト ───
    // キー: 'YYYY-MM-DD|HH:mm'  値: 'can' / 'undecided'
    var answers = {};

    // ─── タップサイクル: 空欄 → can → undecided → 空欄 ───
    var CYCLE = [null, 'can', 'undecided'];

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 初期化
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    window.onload = function () {
      if (!LIFF_ID) {
        showError('LIFF_ID が設定されていません。');
        return;
      }
      var timeoutId = setTimeout(function () {
        showError('初期化がタイムアウトしました。ページを閉じて再度お試しください。');
      }, 15000);

      liff.init({ liffId: LIFF_ID })
        .then(function () {
          clearTimeout(timeoutId);
          if (!liff.isLoggedIn()) { liff.login(); return; }
          loadSchedules();
        })
        .catch(function (err) {
          clearTimeout(timeoutId);
          showError('初期化エラー: ' + (err && err.message ? err.message : String(err)));
        });
    };

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // データ取得
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function loadSchedules() {
      var idToken = liff.getIDToken();
      if (!idToken) { showError('ログイン情報の取得に失敗しました。'); return; }

      fetch(GAS_API_URL + '?liff=getSchedules&idToken=' + encodeURIComponent(idToken))
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok) {
            showError('データの取得に失敗しました。(' + (res.error || '') + ')');
            return;
          }
          // F-4 形式: { dates: [...], userAnswers: {...} }
          renderForm(res.data.dates, res.data.userAnswers);
        })
        .catch(function () {
          showError('通信エラーが発生しました。ページを閉じて再度お試しください。');
        });
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // グリッドフォーム描画
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function renderForm(dates, userAnswers) {
      // 前回の回答を読み込む(AC-18: 前回答復元)
      answers = {};
      if (userAnswers) {
        for (var k in userAnswers) {
          if (userAnswers.hasOwnProperty(k)) answers[k] = userAnswers[k];
        }
      }

      var app = document.getElementById('app');

      if (!dates || dates.length === 0) {
        app.innerHTML = '<div class="empty"><p>現在、回答できる日程がありません。<br>またの機会にご利用ください。</p></div>';
        return;
      }

      var html = '<p class="guide-text">';
      html += 'ボタンをタップするたびに ○(行ける) → △(未定) → 空欄(行けない) と切り替わります。<br>';
      html += '灰色のボタンは体育館が閉まっている時間帯です。';
      html += '</p>';
      html += '<div class="date-list">';

      for (var i = 0; i < dates.length; i++) {
        var dateInfo = dates[i];
        html += '<div class="date-block">';
        html += '<div class="date-label">' + esc(dateInfo.dateLabel) + '</div>';
        if (dateInfo.facilityInfo) {
          html += '<div class="facility-info">' + esc(dateInfo.facilityInfo).replace(/\n/g, '<br>') + '</div>';
        }
        html += '<div class="slot-row">';

        for (var j = 0; j < dateInfo.slots.length; j++) {
          var slot = dateInfo.slots[j];
          var slotKey = dateInfo.date + '|' + slot.slotStart;
          var currentAnswer = answers[slotKey] || null;
          var btnClass = 'btn-slot';
          var btnText = formatSlotLabel(slot.slotStart, null);

          if (!slot.available) {
            // グレーアウト(AC-15)
            btnClass += ' grayed';
            btnText = formatSlotLabel(slot.slotStart, null);
          } else if (currentAnswer === 'can') {
            btnClass += ' selected-can';
            btnText = '○ ' + formatSlotLabel(slot.slotStart, null);
          } else if (currentAnswer === 'undecided') {
            btnClass += ' selected-undecided';
            btnText = '△ ' + formatSlotLabel(slot.slotStart, null);
          }

          if (slot.available) {
            var ariaPressed = currentAnswer === 'can' ? 'true' : (currentAnswer === 'undecided' ? 'mixed' : 'false');
            var stateText = currentAnswer === 'can' ? '行ける' : (currentAnswer === 'undecided' ? '未定' : '未回答');
            var ariaLabel = esc(dateInfo.dateLabel) + ' ' + formatSlotLabel(slot.slotStart, null) + '時台の回答: ' + stateText;
            html += '<button class="' + btnClass + '" data-key="' + esc(slotKey) + '" data-date-label="' + esc(dateInfo.dateLabel) + '" aria-pressed="' + ariaPressed + '" aria-label="' + ariaLabel + '" onclick="tapSlot(this)">' + esc(btnText) + '</button>';
          } else {
            var ariaLabel = esc(dateInfo.dateLabel) + ' ' + formatSlotLabel(slot.slotStart, null) + '時台: 利用不可';
            html += '<button class="' + btnClass + '" disabled aria-disabled="true" aria-label="' + ariaLabel + '">' + esc(btnText) + '</button>';
          }
        }

        html += '</div>'; // slot-row
        html += '</div>'; // date-block
      }

      html += '</div>'; // date-list
      html += '<div class="submit-area"><div class="submit-progress" id="submitProgress"></div><button class="btn-submit" id="submitBtn" onclick="submitAnswers()">送信する</button></div>';

      app.innerHTML = html;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // スロットボタンタップ処理(AC-16: 空欄→○→△→空欄 サイクル)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function tapSlot(btn) {
      var slotKey = btn.getAttribute('data-key');
      if (!slotKey) return;

      var current = answers[slotKey] || null;

      // サイクル: null → 'can' → 'undecided' → null
      var next;
      if (current === null) {
        next = 'can';
      } else if (current === 'can') {
        next = 'undecided';
      } else {
        next = null;
      }

      if (next === null) {
        delete answers[slotKey];
      } else {
        answers[slotKey] = next;
      }

      // ボタン表示・aria 属性を更新
      var slotStart = slotKey.split('|')[1] || '';
      var dateLabel = btn.getAttribute('data-date-label') || '';
      var stateText, ariaPressed;
      if (next === 'can') {
        btn.className = 'btn-slot selected-can';
        btn.textContent = '○ ' + formatSlotLabel(slotStart, null);
        stateText = '行ける'; ariaPressed = 'true';
      } else if (next === 'undecided') {
        btn.className = 'btn-slot selected-undecided';
        btn.textContent = '△ ' + formatSlotLabel(slotStart, null);
        stateText = '未定'; ariaPressed = 'mixed';
      } else {
        btn.className = 'btn-slot';
        btn.textContent = formatSlotLabel(slotStart, null);
        stateText = '未回答'; ariaPressed = 'false';
      }
      btn.setAttribute('aria-pressed', ariaPressed);
      btn.setAttribute('aria-label', (dateLabel ? dateLabel + ' ' : '') + formatSlotLabel(slotStart, null) + '時台の回答: ' + stateText);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 送信処理
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function submitAnswers() {
      var idToken = liff.getIDToken();
      if (!idToken) { showError('ログイン情報の取得に失敗しました。'); return; }

      var btn = document.getElementById('submitBtn');
      var progress = document.getElementById('submitProgress');
      if (btn) { btn.disabled = true; btn.textContent = '送信中...'; }
      if (progress) { progress.classList.add('active'); }

      var url = GAS_API_URL + '?liff=submit'
        + '&idToken=' + encodeURIComponent(idToken)
        + '&answers=' + encodeURIComponent(JSON.stringify(answers));

      fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok) {
            if (btn) { btn.disabled = false; btn.textContent = '送信する'; }
            if (progress) { progress.classList.remove('active'); }
            showError('送信に失敗しました。(' + (res.error || '') + ')');
            return;
          }
          var app = document.getElementById('app');
          app.innerHTML = '<div class="success"><div class="success-icon">&#10003;</div><p class="success-text">回答を送信しました！<br>ご回答ありがとうございます。</p></div>';
          setTimeout(function () { liff.closeWindow(); }, 1500);
        })
        .catch(function () {
          if (btn) { btn.disabled = false; btn.textContent = '送信する'; }
          if (progress) { progress.classList.remove('active'); }
          showError('通信エラーが発生しました。ページを閉じて再度お試しください。');
        });
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ユーティリティ
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    /**
     * スロット開始時刻を短い表示用文字列に変換する
     * 例: '09:00' → '9時'
     * @param {string} slotStart - 'HH:mm' 形式
     * @param {*} _unused
     * @returns {string}
     */
    function formatSlotLabel(slotStart, _unused) {
      if (!slotStart) return '';
      var h = parseInt(slotStart.split(':')[0], 10);
      return h + '時';
    }

    function showError(msg) {
      document.getElementById('app').innerHTML = '<div class="error">' + esc(msg) + '</div>';
    }

    function esc(s) {
      if (typeof s !== 'string') return String(s || '');
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
