<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回答状況確認</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN',
                   'Noto Sans JP', sans-serif;
      background-color: #f5f5f5;
      color: #333;
      min-height: 100vh;
    }

    /* ヘッダー */
    .header {
      background-color: #06C755;
      color: #fff;
      padding: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: bold;
    }

    /* コンテンツエリア */
    .content {
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* 読み込み中 */
    .loading {
      text-align: center;
      padding: 40px 16px;
      color: #666;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #06C755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* エラー */
    .error {
      background-color: #fff3f3;
      border: 1px solid #ffcccc;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
      color: #c0392b;
      text-align: center;
      line-height: 1.6;
    }

    /* スケジュールが空のとき */
    .empty {
      text-align: center;
      padding: 40px 16px;
      color: #666;
      line-height: 1.6;
    }

    /* 説明テキスト */
    .guide-text {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    /* スケジュール一覧 */
    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* スケジュールカード */
    .schedule-card {
      background-color: #fff;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .schedule-date {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #222;
    }

    .schedule-facility {
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
    }

    /* 回答集計 */
    .response-summary {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .response-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 「行ける」ラベル */
    .badge-can {
      flex-shrink: 0;
      display: inline-block;
      padding: 2px 8px;
      background-color: #06C755;
      color: #fff;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      min-width: 56px;
      text-align: center;
    }

    /* 「未定」ラベル */
    .badge-undecided {
      flex-shrink: 0;
      display: inline-block;
      padding: 2px 8px;
      background-color: #757575;
      color: #fff;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      min-width: 56px;
      text-align: center;
    }

    .response-names {
      color: #444;
    }

    .response-count {
      font-size: 12px;
      color: #999;
      margin-left: 4px;
    }

    .no-response {
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>回答状況確認</h1>
  </div>

  <div class="content" id="app">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>読み込み中...</p>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    // GAS テンプレートから埋め込まれた LIFF ID
    var LIFF_ID = '<?= liffId ?>';

    /**
     * ページ初期化
     */
    function initPage() {
      if (!LIFF_ID) {
        showError('設定が不完全です。管理者にお問い合わせください。');
        return;
      }

      liff.init({ liffId: LIFF_ID })
        .then(function () {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          var idToken = liff.getIDToken();
          if (!idToken) {
            showError('ログイン情報の取得に失敗しました。ページを閉じて再度お試しください。');
            return;
          }

          google.script.run
            .withSuccessHandler(function (data) {
              if (!data) {
                showError('エラーが発生しました。ページを閉じて再度お試しください。');
                return;
              }
              renderResults(data.schedules, data.responses);
            })
            .withFailureHandler(function (err) {
              showError('エラーが発生しました。ページを閉じて再度お試しください。');
            })
            .liffGetAllResponses(idToken);
        })
        .catch(function (err) {
          showError('ページの初期化に失敗しました。ページを閉じて再度お試しください。');
        });
    }

    /**
     * 回答状況を描画する(AC-12)
     * @param {Array} schedules - スケジュール一覧
     * @param {Object} responses - { scheduleId: { can: [名前], undecided: [名前] } }
     */
    function renderResults(schedules, responses) {
      var app = document.getElementById('app');

      if (!schedules || schedules.length === 0) {
        app.innerHTML = '<div class="empty"><p>現在、確認できる日程がありません。</p></div>';
        return;
      }

      var html = '';
      html += '<p class="guide-text">直近のスケジュールに対する回答状況です。</p>';
      html += '<div class="schedule-list">';

      for (var i = 0; i < schedules.length; i++) {
        var s = schedules[i];
        var dateLabel = formatDateLabel(s.date, s.startTime, s.endTime);
        var resp = (responses && responses[s.scheduleId]) || { can: [], undecided: [] };
        var canList = resp.can || [];
        var undecidedList = resp.undecided || [];

        html += '<div class="schedule-card">';
        html += '  <div class="schedule-date">' + escapeHtml(dateLabel) + '</div>';
        html += '  <div class="schedule-facility">' + escapeHtml(s.facilityName) + '</div>';
        html += '  <div class="response-summary">';

        // 「行ける」の一覧
        html += '    <div class="response-row">';
        html += '      <span class="badge-can">行ける</span>';
        if (canList.length > 0) {
          html += '      <span class="response-names">' + escapeHtml(canList.join('・')) + '</span>';
          html += '      <span class="response-count">(' + canList.length + '人)</span>';
        } else {
          html += '      <span class="no-response">まだ誰もいません</span>';
        }
        html += '    </div>';

        // 「未定」の一覧
        html += '    <div class="response-row">';
        html += '      <span class="badge-undecided">未定</span>';
        if (undecidedList.length > 0) {
          html += '      <span class="response-names">' + escapeHtml(undecidedList.join('・')) + '</span>';
          html += '      <span class="response-count">(' + undecidedList.length + '人)</span>';
        } else {
          html += '      <span class="no-response">なし</span>';
        }
        html += '    </div>';

        html += '  </div>';
        html += '</div>';
      }

      html += '</div>';
      app.innerHTML = html;
    }

    /**
     * エラーメッセージを表示する
     * @param {string} message
     */
    function showError(message) {
      var app = document.getElementById('app');
      app.innerHTML = '<div class="error">' + escapeHtml(message) + '</div>';
    }

    /**
     * 日付・時刻を「5/15(金) 18:00〜20:00」形式に変換する
     * @param {string} date - 'YYYY-MM-DD'
     * @param {string} startTime - 'HH:mm'
     * @param {string} endTime - 'HH:mm'
     * @returns {string}
     */
    function formatDateLabel(date, startTime, endTime) {
      var weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      var d = new Date(date + 'T00:00:00+09:00');
      var m = d.getMonth() + 1;
      var day = d.getDate();
      var w = weekdays[d.getDay()];
      return m + '/' + day + '(' + w + ') ' + startTime + '〜' + endTime;
    }

    /**
     * XSS を防ぐための HTML エスケープ
     * @param {string} str
     * @returns {string}
     */
    function escapeHtml(str) {
      if (typeof str !== 'string') return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.onload = initPage;
  </script>
</body>
</html>
