<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日程回答フォーム</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN',
                   'Noto Sans JP', sans-serif;
      background-color: #f5f5f5;
      color: #333;
      min-height: 100vh;
    }

    /* ヘッダー */
    .header {
      background-color: #06C755;
      color: #fff;
      padding: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: bold;
    }

    /* コンテンツエリア */
    .content {
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* 読み込み中 */
    .loading {
      text-align: center;
      padding: 40px 16px;
      color: #666;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #06C755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* エラー */
    .error {
      background-color: #fff3f3;
      border: 1px solid #ffcccc;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
      color: #c0392b;
      text-align: center;
      line-height: 1.6;
    }

    /* スケジュールが空のとき */
    .empty {
      text-align: center;
      padding: 40px 16px;
      color: #666;
      line-height: 1.6;
    }

    /* スケジュール一覧 */
    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    /* スケジュールカード */
    .schedule-card {
      background-color: #fff;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .schedule-date {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #222;
    }

    .schedule-facility {
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
    }

    /* 回答ボタン群 */
    .answer-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-answer {
      flex: 1;
      padding: 10px 8px;
      border: 2px solid #ddd;
      border-radius: 6px;
      background-color: #f9f9f9;
      color: #555;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .btn-answer:active {
      opacity: 0.7;
    }

    /* 「行ける」選択済み */
    .btn-answer.selected-can {
      background-color: #06C755;
      border-color: #06C755;
      color: #fff;
    }

    /* 「未定」選択済み */
    .btn-answer.selected-undecided {
      background-color: #757575;
      border-color: #757575;
      color: #fff;
    }

    /* 送信ボタン */
    .submit-area {
      position: sticky;
      bottom: 0;
      background-color: #f5f5f5;
      padding: 12px 0 24px;
    }

    .btn-submit {
      display: block;
      width: 100%;
      padding: 16px;
      background-color: #06C755;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn-submit:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }

    .btn-submit:not(:disabled):active {
      opacity: 0.8;
    }

    /* 送信完了 */
    .success {
      text-align: center;
      padding: 40px 16px;
      color: #06C755;
    }

    .success-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .success-text {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      line-height: 1.6;
    }

    /* 説明テキスト */
    .guide-text {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>バドミントン 日程回答</h1>
  </div>

  <div class="content" id="app">
    <!-- 読み込み中の表示(JS が動き始めると差し替わる) -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>読み込み中...</p>
    </div>
  </div>

  <!--
    LIFF SDK を読み込む。
    liffId は GAS のテンプレート変数 <?= liffId ?> でサーバー側から埋め込まれる。
    (= スクリプトプロパティ LIFF_FORM_ID の値)
  -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    // GAS テンプレートから埋め込まれた LIFF ID
    var LIFF_ID = '<?= liffId ?>';

    // 現在選択中の回答を保持するオブジェクト
    // { 'SCH_xxx': 'can', 'SCH_yyy': 'undecided' }
    var answers = {};

    /**
     * フォームを描画する
     * @param {Array} schedules - スケジュール一覧
     * @param {Object} userAnswers - 前回の回答 { scheduleId: 'can'|'undecided' }
     */
    function renderForm(schedules, userAnswers) {
      // 前回の回答を answers に読み込む(AC-10: 前回答の復元)
      answers = {};
      if (userAnswers) {
        for (var key in userAnswers) {
          answers[key] = userAnswers[key];
        }
      }

      var app = document.getElementById('app');

      if (!schedules || schedules.length === 0) {
        app.innerHTML = '<div class="empty"><p>現在、回答できる日程がありません。<br>またの機会にご利用ください。</p></div>';
        return;
      }

      var html = '';
      html += '<p class="guide-text">参加できる日程に「行ける」、未定の場合は「未定」を選んでください。<br>選ばなかった日程は「行けない」として扱います。</p>';
      html += '<div class="schedule-list" id="scheduleList">';

      for (var i = 0; i < schedules.length; i++) {
        var s = schedules[i];
        var dateLabel = formatDateLabel(s.date, s.startTime, s.endTime);
        var currentAnswer = answers[s.scheduleId] || '';
        var canClass = (currentAnswer === 'can') ? 'btn-answer selected-can' : 'btn-answer';
        var undecidedClass = (currentAnswer === 'undecided') ? 'btn-answer selected-undecided' : 'btn-answer';

        html += '<div class="schedule-card" data-id="' + escapeHtml(s.scheduleId) + '">';
        html += '  <div class="schedule-date">' + escapeHtml(dateLabel) + '</div>';
        html += '  <div class="schedule-facility">' + escapeHtml(s.facilityName) + '</div>';
        html += '  <div class="answer-buttons">';
        html += '    <button class="' + canClass + '" onclick="selectAnswer(\'' + escapeHtml(s.scheduleId) + '\', \'can\')">行ける</button>';
        html += '    <button class="' + undecidedClass + '" onclick="selectAnswer(\'' + escapeHtml(s.scheduleId) + '\', \'undecided\')">未定</button>';
        html += '  </div>';
        html += '</div>';
      }

      html += '</div>';
      html += '<div class="submit-area"><button class="btn-submit" id="submitBtn" onclick="submitAnswers()">送信する</button></div>';

      app.innerHTML = html;
    }

    /**
     * 回答ボタンがタップされたときに選択状態を更新する
     * @param {string} scheduleId
     * @param {string} value - 'can' または 'undecided'
     */
    function selectAnswer(scheduleId, value) {
      // 同じボタンをもう一度タップしたら選択解除
      if (answers[scheduleId] === value) {
        delete answers[scheduleId];
      } else {
        answers[scheduleId] = value;
      }

      // 該当カードのボタン表示を更新
      var card = document.querySelector('.schedule-card[data-id="' + scheduleId + '"]');
      if (!card) return;

      var buttons = card.querySelectorAll('.btn-answer');
      var currentAnswer = answers[scheduleId] || '';

      buttons[0].className = (currentAnswer === 'can') ? 'btn-answer selected-can' : 'btn-answer';
      buttons[1].className = (currentAnswer === 'undecided') ? 'btn-answer selected-undecided' : 'btn-answer';
    }

    /**
     * 回答を送信する
     */
    function submitAnswers() {
      var idToken = liff.getIDToken();
      if (!idToken) {
        showError('ログイン情報の取得に失敗しました。ページを閉じて再度お試しください。');
        return;
      }

      // ボタンを無効化して二重送信を防ぐ
      var submitBtn = document.getElementById('submitBtn');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = '送信中...';
      }

      google.script.run
        .withSuccessHandler(function (result) {
          if (!result) {
            // 送信失敗
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = '送信する';
            }
            showError('送信に失敗しました。ページを閉じて再度お試しください。');
            return;
          }

          // 送信成功 → 完了画面を表示してウィンドウを閉じる(AC-11)
          var app = document.getElementById('app');
          app.innerHTML = '<div class="success"><div class="success-icon">&#10003;</div><p class="success-text">回答を送信しました！<br>ご回答ありがとうございます。</p></div>';

          // 少し待ってから LIFF ウィンドウを閉じる
          setTimeout(function () {
            liff.closeWindow();
          }, 1500);
        })
        .withFailureHandler(function (err) {
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = '送信する';
          }
          showError('送信に失敗しました。ページを閉じて再度お試しください。');
        })
        .liffSubmitResponses(idToken, answers);
    }

    /**
     * エラーメッセージを表示する
     * @param {string} message
     */
    function showError(message) {
      var app = document.getElementById('app');
      app.innerHTML = '<div class="error">' + escapeHtml(message) + '</div>';
    }

    /**
     * 日付・時刻を「5/15(金) 18:00〜20:00」形式に変換する
     * @param {string} date - 'YYYY-MM-DD'
     * @param {string} startTime - 'HH:mm'
     * @param {string} endTime - 'HH:mm'
     * @returns {string}
     */
    function formatDateLabel(date, startTime, endTime) {
      var weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      var d = new Date(date + 'T00:00:00+09:00');
      var m = d.getMonth() + 1;
      var day = d.getDate();
      var w = weekdays[d.getDay()];
      return m + '/' + day + '(' + w + ') ' + startTime + '〜' + endTime;
    }

    /**
     * XSS を防ぐための HTML エスケープ
     * @param {string} str
     * @returns {string}
     */
    function escapeHtml(str) {
      if (typeof str !== 'string') return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ページ読み込み完了後に初期化を実行
    window.onload = function () {
      // デバッグ: LIFF ID が埋め込まれているか確認
      document.getElementById('loading').innerHTML =
        '<div class="spinner"></div><p>読み込み中...</p><p style="font-size:11px;color:#aaa;margin-top:8px;">ID: ' + (LIFF_ID || '(空)') + '</p>';

      // 10秒経っても完了しない場合はエラー表示
      var timeoutId = setTimeout(function () {
        showError('初期化がタイムアウトしました。ページを閉じて再度お試しください。\n(LIFF ID: ' + (LIFF_ID || '空') + ')');
      }, 10000);

      liff.init({ liffId: LIFF_ID })
        .then(function () {
          clearTimeout(timeoutId);
          initPage();
        })
        .catch(function (err) {
          clearTimeout(timeoutId);
          showError('初期化エラー: ' + (err && err.message ? err.message : JSON.stringify(err)));
        });
    };

    function initPage() {
      if (!LIFF_ID) {
        showError('設定が不完全です。管理者にお問い合わせください。');
        return;
      }

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      var idToken = liff.getIDToken();
      if (!idToken) {
        showError('ログイン情報の取得に失敗しました。ページを閉じて再度お試しください。');
        return;
      }

      google.script.run
        .withSuccessHandler(function (data) {
          if (!data) {
            showError('エラーが発生しました。ページを閉じて再度お試しください。');
            return;
          }
          renderForm(data.schedules, data.userAnswers);
        })
        .withFailureHandler(function (err) {
          showError('エラーが発生しました。ページを閉じて再度お試しください。');
        })
        .liffGetSchedulesAndResponses(idToken);
    }
  </script>
</body>
</html>
